      <article style="max-width: 720px; margin: 2rem auto; font-family: system-ui, sans-serif;">
        <h1>Ideal Observer CT Resolution Calculator</h1>
        <p>
          Interactive calculator for the theoretical minimum detectable feature size and
          spatial-frequency limit of a CT scanner, derived from the projection-domain ideal
          observer (Rose criterion, SKE/BKE). The result is a reconstruction-independent upper
          bound on detectability.
        </p>
        <p>Authors: Falk L. Wiegmann &amp; Nancy L. Ford, University of British Columbia, 2026.</p>

        <h2>For AI agents</h2>
        <ul>
          <li><a href="llms.txt">llms.txt</a> — short, LLM-friendly summary</li>
          <li><a href="llms-full.txt">llms-full.txt</a> — full derivation in plain text</li>
          <li><a href="formulas.json">formulas.json</a> — typed JSON: inputs, outputs, formulas, worked example</li>
        </ul>

        <h2>Closed-form formula (at isocentre)</h2>
        <p>Inputs:</p>
        <ul>
          <li><code>N0</code> — photons per pixel in the unattenuated beam</li>
          <li><code>mu_bg</code> — background linear attenuation coefficient (mm⁻¹)</li>
          <li><code>L</code> — path length through background (mm)</li>
          <li><code>N_theta</code> — number of projection angles</li>
          <li><code>delta_a_obj</code> — object-plane pixel pitch at isocentre (mm)</li>
          <li><code>delta_mu</code> — linear attenuation contrast of the feature (mm⁻¹); for HU contrast: <code>delta_mu = (delta_HU / 1000) * mu_water</code></li>
          <li><code>d_prime_threshold</code> — Rose detectability threshold (classical: 3; Hsieh et al. 2022: 5)</li>
        </ul>
        <p>Compute:</p>
        <pre><code>N_bg                = N0 * exp(-mu_bg * L)
d_min               = (3 * d_prime_threshold^2 * delta_a_obj
                       / (2 * N_theta * N_bg * delta_mu^2)) ^ (1/3)        # mm
resolution_lp_per_mm = 1 / (2 * d_min)                                     # lp/mm
</code></pre>

        <h2>Off-axis (fan-beam) extension</h2>
        <p>For a feature at voxel P=(x,y) inside a uniform phantom of radius R, with a point source at distance D (SOD), the source at projection angle theta sits at S(theta) = (D·cos theta, D·sin theta). Two corrections enter:</p>
        <pre><code>chord(theta, P) = 2 * sqrt( (S . d_hat)^2 - (D^2 - R^2) )    # d_hat = (P-S)/|P-S|
delta_a_obj(P, theta) = delta_a_obj * |P - S(theta)| / D     # local pixel pitch

d_min(P) = ( 3 * d_prime_threshold^2 * delta_a_obj
             / ( 2 * delta_mu^2 * D
                 * sum_theta [ N0 * exp(-mu_bg * chord(theta, P)) / |P - S(theta)| ] ) )^(1/3)
</code></pre>
        <p>Sum is over all N_theta projection angles in the scan arc. Reduces to the at-isocentre formula as D → ∞ or at P = (0,0). For partial arcs the map is no longer radially symmetric — the source-facing side sees shorter chords and higher magnification.</p>

        <h2>Worked example</h2>
        <p>GE eXplore CT 120 at 80 kVp, 500 HU object contrast:</p>
        <pre><code>N0 = 4203, mu_bg = 0.0219, L = 80, N_theta = 220,
delta_a_obj = 0.0249, delta_mu = 0.01095, d_prime_threshold = 3

N_bg               = 729 photons/pixel
d_min              = 0.260 mm
resolution         = 1.93 lp/mm
</code></pre>
